name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check for security vulnerabilities
        working-directory: ./backend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # TODO: Add when tests are created
      # - name: Run tests
      #   working-directory: ./backend
      #   run: npm test
      #   env:
      #     NODE_ENV: test

      # TODO: Add when tests are created
      # - name: Check test coverage
      #   working-directory: ./backend
      #   run: npm run test:coverage

      - name: Check Node.js version compatibility
        working-directory: ./backend
        run: node --version

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ./backend
        run: docker build -t behavioural-hub-api:${{ github.sha }} .

      - name: Test Docker image
        working-directory: ./backend
        run: |
          docker run -d --name test-container -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e JWT_SECRET=test-secret \
            -e JWT_REFRESH_SECRET=test-refresh-secret \
            -e ALLOWED_ORIGINS=http://localhost:3000 \
            -e DATABASE_PATH=/app/data/behavioural_hub.db \
            behavioural-hub-api:${{ github.sha }}

          # Wait for container to start and initialize database
          echo "Waiting for container to start..."
          sleep 10

          # Show container logs for debugging
          echo "Container logs:"
          docker logs test-container

          # Wait for health endpoint to be ready (with retries)
          echo "Testing health endpoint..."
          max_attempts=12
          attempt=0
          until curl -f http://localhost:4000/health || [ $attempt -eq $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts failed, waiting 5 seconds..."
            sleep 5
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "Health check failed after $max_attempts attempts"
            echo "Final container logs:"
            docker logs test-container
            docker stop test-container
            docker rm test-container
            exit 1
          fi

          echo "✅ Health check passed!"

          # Cleanup
          docker stop test-container
          docker rm test-container

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Deployment job (only on main branch)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-docker, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Ready to deploy to production"
          echo "⚠️ Configure your deployment target (AWS, DigitalOcean, etc.)"

      # TODO: Add actual deployment steps
