<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Builder | Behavioural Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #1a202c;
            overflow-x: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr 400px;
            gap: 20px;
            align-items: start;
        }

        /* Sidebar - Flows List */
        .sidebar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .sidebar h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1a202c;
        }

        .flow-filter {
            margin-bottom: 20px;
        }

        .flow-filter select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .flow-filter select:focus {
            outline: none;
            border-color: #667eea;
        }

        .flow-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .flow-item {
            padding: 14px;
            border-radius: 12px;
            background: white;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .flow-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .flow-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .flow-item-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .flow-item-meta {
            font-size: 12px;
            opacity: 0.7;
            display: flex;
            gap: 10px;
        }

        .flow-item.active .flow-item-meta {
            opacity: 0.9;
        }

        /* Main Canvas */
        .canvas {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            min-height: 600px;
        }

        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .canvas-title h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .canvas-title p {
            font-size: 14px;
            color: #64748b;
        }

        .canvas-actions {
            display: flex;
            gap: 10px;
        }

        .canvas-actions .btn {
            padding: 10px 20px;
            font-size: 13px;
        }

        /* Screens Grid */
        .screens-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .screen-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .screen-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }

        .screen-number {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .screen-type {
            font-size: 11px;
            color: #667eea;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .screen-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 6px;
            color: #1a202c;
        }

        .screen-subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .screen-cta {
            padding: 8px 14px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            color: #475569;
        }

        .add-screen-card {
            border: 2px dashed #cbd5e1;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        .add-screen-card:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .add-screen-icon {
            font-size: 48px;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        .add-screen-text {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
        }

        /* Suggestions Panel */
        .suggestions-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .suggestions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .suggestions-header h2 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .generate-btn {
            padding: 8px 16px;
            font-size: 12px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        .suggestion-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            background: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #64748b;
        }

        .filter-chip:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-chip.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .suggestions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 700px;
            overflow-y: auto;
        }

        .suggestion-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .suggestion-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.15);
        }

        .suggestion-card.high-priority {
            border-left: 4px solid #ef4444;
        }

        .suggestion-card.medium-priority {
            border-left: 4px solid #f59e0b;
        }

        .suggestion-card.low-priority {
            border-left: 4px solid #3b82f6;
        }

        .suggestion-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .suggestion-title {
            font-weight: 600;
            font-size: 14px;
            color: #1a202c;
            margin-bottom: 4px;
        }

        .suggestion-category {
            font-size: 11px;
            color: #667eea;
            font-weight: 600;
            text-transform: uppercase;
        }

        .suggestion-actions {
            display: flex;
            gap: 6px;
        }

        .suggestion-action-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .suggestion-action-btn.plan {
            background: #dbeafe;
            color: #3b82f6;
        }

        .suggestion-action-btn.plan:hover {
            background: #3b82f6;
            color: white;
        }

        .suggestion-action-btn.reject {
            background: #fee2e2;
            color: #ef4444;
        }

        .suggestion-action-btn.reject:hover {
            background: #ef4444;
            color: white;
        }

        .suggestion-description {
            font-size: 13px;
            color: #475569;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .suggestion-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #64748b;
        }

        .meta-item.impact {
            color: #10b981;
            font-weight: 600;
        }

        .meta-item.confidence {
            color: #667eea;
            font-weight: 600;
        }

        .suggestion-examples {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
        }

        .example-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            color: #64748b;
        }

        .example-company {
            font-weight: 600;
            color: #1a202c;
        }

        .example-metric {
            color: #10b981;
            font-weight: 600;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-icon {
            font-size: 64px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 10px;
        }

        .empty-description {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.suggested {
            background: #dbeafe;
            color: #3b82f6;
        }

        .status-badge.planned {
            background: #fef3c7;
            color: #f59e0b;
        }

        .status-badge.tested {
            background: #d1fae5;
            color: #10b981;
        }

        /* Responsive */
        @media (max-width: 1400px) {
            .main-content {
                grid-template-columns: 280px 1fr 380px;
            }
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .sidebar,
            .suggestions-panel {
                max-width: 100%;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .screens-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>🎯 Onboarding Builder</h1>
                <p style="font-size: 14px; color: #64748b; margin-top: 5px;">
                    Build, test, and optimize your onboarding flows with AI-powered suggestions
                </p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="location.href='index.html'">← Back to Hub</button>
                <button class="btn btn-primary" onclick="createNewFlow()">+ New Flow</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar: Flows List -->
            <div class="sidebar">
                <h2>📋 Onboarding Flows</h2>

                <div class="flow-filter">
                    <select id="countryFilter" onchange="filterFlows()">
                        <option value="">All Countries</option>
                        <option value="US">🇺🇸 United States</option>
                        <option value="TR">🇹🇷 Turkey</option>
                        <option value="AZ">🇦🇿 Azerbaijan</option>
                        <option value="GB">🇬🇧 United Kingdom</option>
                    </select>
                </div>

                <div class="flow-list" id="flowList">
                    <!-- Flows will be loaded here -->
                </div>
            </div>

            <!-- Main Canvas -->
            <div class="canvas">
                <div id="canvasContent">
                    <!-- Content will be loaded dynamically -->
                </div>
            </div>

            <!-- Suggestions Panel -->
            <div class="suggestions-panel">
                <div class="suggestions-header">
                    <h2>
                        💡 AI Suggestions
                        <span class="ai-badge">AI-Powered</span>
                    </h2>
                    <button class="generate-btn" onclick="generateSuggestions()">
                        🤖 Generate
                    </button>
                </div>

                <div class="suggestion-filters">
                    <div class="filter-chip active" data-status="all" onclick="filterSuggestions('all')">All</div>
                    <div class="filter-chip" data-status="suggested" onclick="filterSuggestions('suggested')">Suggested</div>
                    <div class="filter-chip" data-status="planned" onclick="filterSuggestions('planned')">Planned</div>
                    <div class="filter-chip" data-status="tested" onclick="filterSuggestions('tested')">Tested</div>
                </div>

                <div class="suggestions-list" id="suggestionsList">
                    <!-- Suggestions will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="ui-common.js"></script>
    <script src="auth-check.js"></script>
    <script>
        // API Configuration
        const API_BASE_URL = BehaviouralConfig.API.BASE_URL.replace('/api', ''); // Remove /api suffix

        // Global State
        let currentFlow = null;
        let allFlows = [];
        let allSuggestions = [];
        let currentSuggestionFilter = 'all';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadFlows();
        });

        const MOCK_FLOWS = [
            { id: 1, name: 'Yeni Kullanıcı Karşılama Akışı', description: 'Kullanıcıları platforma tanıştıran temel onboarding deneyimi', status: 'active', steps: 5, completion_rate: 72, created_at: '2024-01-10' },
            { id: 2, name: 'Premium Upgrade Akışı', description: 'Ücretsiz kullanıcıları premium\'a yönlendiren dönüşüm akışı', status: 'active', steps: 3, completion_rate: 45, created_at: '2024-01-20' },
            { id: 3, name: 'Yeniden Aktivasyon Akışı', description: '30+ gün aktif olmayan kullanıcıları geri kazanma akışı', status: 'draft', steps: 4, completion_rate: 0, created_at: '2024-02-01' }
        ];

        // Load all flows
        async function loadFlows() {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 8000);
                const token = localStorage.getItem('auth_token');
                const response = await fetch(`${API_BASE_URL}/api/onboarding/flows`, {
                    headers: { 'Authorization': `Bearer ${token}` },
                    signal: controller.signal
                });
                clearTimeout(timeout);
                const data = await response.json();

                if (data.success) {
                    allFlows = data.data;
                    renderFlows(allFlows);
                    if (allFlows.length > 0) {
                        loadFlow(allFlows[0].id);
                    } else {
                        showEmptyState();
                    }
                }
            } catch (error) {
                console.warn('Backend unavailable, using demo data');
                allFlows = MOCK_FLOWS;
                renderFlows(allFlows);
                showEmptyState();
            }
        }

        // Render flows in sidebar
        function renderFlows(flows) {
            const flowList = document.getElementById('flowList');

            if (flows.length === 0) {
                flowList.innerHTML = '<p style="text-align: center; color: #64748b; padding: 20px;">No flows found</p>';
                return;
            }

            flowList.innerHTML = flows.map(flow => `
                <div class="flow-item ${currentFlow?.id === flow.id ? 'active' : ''}"
                     onclick="loadFlow(${flow.id})">
                    <div class="flow-item-name">${flow.name}</div>
                    <div class="flow-item-meta">
                        <span>${getFlagEmoji(flow.country_code)} ${flow.country_code}</span>
                        <span>${flow.total_screens} screens</span>
                    </div>
                </div>
            `).join('');
        }

        // Load specific flow
        async function loadFlow(flowId) {
            try {
                const token = localStorage.getItem('auth_token');
                const response = await fetch(`${API_BASE_URL}/api/onboarding/flows/${flowId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    currentFlow = data.data;
                    renderCanvas(currentFlow);
                    renderSuggestions(currentFlow.suggestions);

                    // Update active flow in sidebar
                    renderFlows(allFlows);
                }
            } catch (error) {
                console.error('Error loading flow:', error);
            }
        }

        // Render canvas with screens
        function renderCanvas(flow) {
            const canvasContent = document.getElementById('canvasContent');

            canvasContent.innerHTML = `
                <div class="canvas-header">
                    <div class="canvas-title">
                        <h2>${flow.name}</h2>
                        <p>${getFlagEmoji(flow.country_code)} ${flow.country_code} • ${flow.total_screens} screens • ${Math.round(flow.avg_completion_rate * 100)}% completion</p>
                    </div>
                    <div class="canvas-actions">
                        <button class="btn btn-secondary" onclick="editFlow(${flow.id})">✏️ Edit</button>
                        <button class="btn btn-primary" onclick="addScreen()">+ Add Screen</button>
                    </div>
                </div>

                <div class="screens-grid">
                    ${flow.screens.map((screen, index) => `
                        <div class="screen-card" onclick="editScreen(${screen.id})">
                            <div class="screen-number">${index + 1}</div>
                            <div class="screen-type">${screen.screen_type}</div>
                            <div class="screen-title">${screen.title || 'Untitled'}</div>
                            <div class="screen-subtitle">${screen.subtitle || ''}</div>
                            <div class="screen-cta">${screen.cta_text || 'Continue'}</div>
                        </div>
                    `).join('')}

                    <div class="screen-card add-screen-card" onclick="addScreen()">
                        <div class="add-screen-icon">+</div>
                        <div class="add-screen-text">Add Screen</div>
                    </div>
                </div>
            `;
        }

        // Render suggestions
        function renderSuggestions(suggestions) {
            allSuggestions = suggestions || [];
            const filteredSuggestions = filterSuggestionsByStatus(allSuggestions, currentSuggestionFilter);

            const suggestionsList = document.getElementById('suggestionsList');

            if (filteredSuggestions.length === 0) {
                suggestionsList.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: #64748b;">
                        <div style="font-size: 48px; margin-bottom: 15px;">💡</div>
                        <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">No suggestions yet</div>
                        <div style="font-size: 13px;">Click "Generate" to get AI-powered recommendations</div>
                    </div>
                `;
                return;
            }

            suggestionsList.innerHTML = filteredSuggestions.map(suggestion => `
                <div class="suggestion-card ${suggestion.priority}-priority">
                    <div class="suggestion-header">
                        <div>
                            <div class="suggestion-title">${suggestion.title}</div>
                            <div class="suggestion-category">${suggestion.category?.replace(/_/g, ' ')}</div>
                        </div>
                        <div class="suggestion-actions">
                            ${suggestion.status === 'suggested' ? `
                                <button class="suggestion-action-btn plan"
                                        onclick="planSuggestion(${suggestion.id})"
                                        title="Add to Plan">
                                    📅
                                </button>
                                <button class="suggestion-action-btn reject"
                                        onclick="rejectSuggestion(${suggestion.id})"
                                        title="Reject">
                                    ✕
                                </button>
                            ` : `
                                <span class="status-badge ${suggestion.status}">${suggestion.status}</span>
                            `}
                        </div>
                    </div>

                    <div class="suggestion-description">
                        ${suggestion.description}
                    </div>

                    <div class="suggestion-meta">
                        <div class="meta-item impact">📈 ${suggestion.expected_impact}</div>
                        <div class="meta-item confidence">🎯 ${Math.round(suggestion.confidence_score * 100)}% confidence</div>
                    </div>

                    ${suggestion.industry_examples && suggestion.industry_examples.length > 0 ? `
                        <div class="suggestion-examples">
                            <div style="font-weight: 600; margin-bottom: 8px; color: #475569;">Industry Examples:</div>
                            ${suggestion.industry_examples.map(ex => `
                                <div class="example-item">
                                    <span class="example-company">${ex.company}</span>
                                    <span class="example-metric">${ex.metric}</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Filter suggestions by status
        function filterSuggestionsByStatus(suggestions, status) {
            if (status === 'all') return suggestions;
            return suggestions.filter(s => s.status === status);
        }

        // Filter suggestions (UI)
        function filterSuggestions(status) {
            currentSuggestionFilter = status;

            // Update active filter chip
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.classList.toggle('active', chip.dataset.status === status);
            });

            // Re-render suggestions
            renderSuggestions(allSuggestions);
        }

        // Generate AI suggestions
        async function generateSuggestions() {
            if (!currentFlow) {
                alert('Please select a flow first');
                return;
            }

            const btn = event.target;
            btn.innerHTML = '<div class="loading-spinner"></div> Generating...';
            btn.disabled = true;

            try {
                const token = localStorage.getItem('auth_token');
                const response = await fetch(`${API_BASE_URL}/api/onboarding/suggestions/generate`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        flow_id: currentFlow.id,
                        country_code: currentFlow.country_code,
                        target_segment: 'all',
                        app_category: 'utility',
                        current_metrics: {
                            completion_rate: currentFlow.avg_completion_rate * 100,
                            conversion_rate: currentFlow.conversion_rate * 100
                        }
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Reload flow to get updated suggestions
                    await loadFlow(currentFlow.id);
                    alert(`✅ Generated ${data.count} new suggestions!`);
                } else {
                    alert('Failed to generate suggestions: ' + data.error);
                }
            } catch (error) {
                console.error('Error generating suggestions:', error);
                alert('Failed to generate suggestions');
            } finally {
                btn.innerHTML = '🤖 Generate';
                btn.disabled = false;
            }
        }

        // Plan suggestion
        async function planSuggestion(suggestionId) {
            event.stopPropagation();

            try {
                const token = localStorage.getItem('auth_token');
                const response = await fetch(`${API_BASE_URL}/api/onboarding/suggestions/${suggestionId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'planned',
                        planned_date: new Date().toISOString()
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Reload flow
                    await loadFlow(currentFlow.id);
                }
            } catch (error) {
                console.error('Error planning suggestion:', error);
            }
        }

        // Reject suggestion
        async function rejectSuggestion(suggestionId) {
            event.stopPropagation();

            if (!confirm('Are you sure you want to reject this suggestion?')) {
                return;
            }

            try {
                const token = localStorage.getItem('auth_token');
                const response = await fetch(`${API_BASE_URL}/api/onboarding/suggestions/${suggestionId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'rejected'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Reload flow
                    await loadFlow(currentFlow.id);
                }
            } catch (error) {
                console.error('Error rejecting suggestion:', error);
            }
        }
